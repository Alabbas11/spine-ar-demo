<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Spine AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- FBX Support -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>


  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }


    #startScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #111;

      z-index: 999999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

    }


    #startButton {

      border: 0;

      background: white;

      color: black;

      padding: 18px 30px;

      border-radius: 50px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }


    #message {

      color: white;

      margin-top: 20px;

      font-size: 14px;

      text-align: center;

    }


  </style>
</head>



<body>


<!-- شاشة البداية -->

<div id="startScreen">

  <button id="startButton">
    START CAMERA
  </button>

  <div id="message">
    Tap to start AR
  </div>

</div>



<!-- AR Scene -->

<a-scene

  id="arScene"

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: yes;
    uiError: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    antialias: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  embedded

>


  <!-- CAMERA -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- LIGHT -->

  <a-light

    type="ambient"

    intensity="2"

    color="#FFFFFF">

  </a-light>


  <a-light

    type="directional"

    position="1 2 3"

    intensity="3"

    color="#FFFFFF">

  </a-light>



  <!-- TARGET -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0">


    <!-- SPINE MODEL -->

    <a-entity

      id="spineModel"

      fbx-model="src: url(./spine.FBX)"

      position="0 0 0.20"

      rotation="0 0 0"

      scale="1 1 1">

    </a-entity>



    <!-- CERVICAL -->

    <a-text

      value="CERVICAL"

      position="0.22 0.43 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="0.10 0.43 0.10"

      width="0.20"

      height="0.005"

      depth="0.005"

      color="#FFFFFF">

    </a-box>



    <!-- THORACIC -->

    <a-text

      value="THORACIC"

      position="-0.55 0.05 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="-0.12 0.05 0.10"

      width="0.25"

      height="0.005"

      depth="0.005"

      color="#FFFFFF">

    </a-box>



    <!-- LUMBAR -->

    <a-text

      value="LUMBAR"

      position="0.22 -0.37 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="0.10 -0.37 0.10"

      width="0.20"

      height="0.005"

      depth="0.005"

      color="#FFFFFF">

    </a-box>


  </a-entity>


</a-scene>



<script>


const scene = document.querySelector("#arScene");

const startScreen =
document.querySelector("#startScreen");

const startButton =
document.querySelector("#startButton");

const message =
document.querySelector("#message");

const spine =
document.querySelector("#spineModel");

const target =
document.querySelector("#target");



/* -------------------------

   FBX STATUS

-------------------------- */


spine.addEventListener(
"model-loaded",

() => {

  console.log("SPINE LOADED");

}

);



spine.addEventListener(
"model-error",

(event) => {

  console.error(
    "SPINE ERROR",
    event.detail
  );

}

);



/* -------------------------

   START CAMERA

-------------------------- */


startButton.addEventListener(

"click",

async () => {


  startButton.disabled = true;

  message.innerHTML =
  "Starting camera...";


  try {


    const mindarSystem =
    scene.systems[
      "mindar-image-system"
    ];


    await mindarSystem.start();


    console.log(
      "CAMERA STARTED"
    );


    startScreen.style.display =
    "none";


  }

  catch(error) {


    console.error(
      "CAMERA ERROR",
      error
    );


    message.innerHTML =
    "Camera could not start.<br>Please allow camera permission.";


    startButton.disabled =
    false;


  }


}

);



/* -------------------------

   AR READY

-------------------------- */


scene.addEventListener(

"arReady",

() => {

  console.log(
    "AR READY"
  );

}

);



scene.addEventListener(

"arError",

(event) => {

  console.error(
    "AR ERROR",
    event
  );


  message.innerHTML =
  "AR camera error";

}

);



/* -------------------------

   TARGET

-------------------------- */


target.addEventListener(

"targetFound",

() => {

  console.log(
    "TARGET FOUND"
  );

}

);



target.addEventListener(

"targetLost",

() => {

  console.log(
    "TARGET LOST"
  );

}

);


</script>


</body>
</html>
