<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Spine AR</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- MIND AR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <!-- FBX LOADER -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.loaders.min.js"></script>


  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

</head>


<body>


<a-scene

  mindar-image="imageTargetSrc: ./targets.mind;"

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- CAMERA -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <!-- LIGHT -->

  <a-light

    type="ambient"

    color="#FFFFFF"

    intensity="2">

  </a-light>


  <a-light

    type="directional"

    color="#FFFFFF"

    intensity="2"

    position="1 1 2">

  </a-light>



  <!-- TARGET -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0">


    <!-- SPINE -->

    <a-entity

      id="spineModel"

      fbx-model="src: url(./spine.FBX)"

      position="0 0 0.2"

      rotation="0 0 0"

      scale="1 1 1">

    </a-entity>



    <!-- CERVICAL -->

    <a-text

      value="CERVICAL"

      position="0.22 0.43 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="0.10 0.43 0.10"

      width="0.20"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>



    <!-- THORACIC -->

    <a-text

      value="THORACIC"

      position="-0.55 0.05 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="-0.12 0.05 0.10"

      width="0.25"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>



    <!-- LUMBAR -->

    <a-text

      value="LUMBAR"

      position="0.22 -0.37 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF">

    </a-text>


    <a-box

      position="0.10 -0.37 0.10"

      width="0.20"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>


  </a-entity>


</a-scene>



<script>

  const scene = document.querySelector("a-scene");

  const spine = document.querySelector("#spineModel");

  const target = document.querySelector("#target");


  scene.addEventListener("arReady", () => {

    console.log("CAMERA READY");

  });


  scene.addEventListener("arError", (event) => {

    console.log("CAMERA ERROR");

    console.log(event);

  });


  spine.addEventListener("model-loaded", () => {

    console.log("SPINE LOADED");

  });


  spine.addEventListener("model-error", (event) => {

    console.log("SPINE ERROR");

    console.log(event.detail);

  });


  target.addEventListener("targetFound", () => {

    console.log("TARGET FOUND");

  });


  target.addEventListener("targetLost", () => {

    console.log("TARGET LOST");

  });

</script>


</body>

</html>
