<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

  <title>Spine AR Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity mindar-image-target="targetIndex: 0">


    <!-- مجسم تجريبي -->

    <a-box
      position="0 0 0.25"
      rotation="0 0 0"
      scale="0.35 0.35 0.35"
      color="#4CC3D9">

      <a-animation
        attribute="rotation"
        to="0 360 0"
        dur="5000"
        repeat="indefinite">
      </a-animation>

    </a-box>


    <!-- العنوان -->

    <a-text
      value="HUMAN SPINE"
      position="-0.42 0.55 0.1"
      scale="0.35 0.35 0.35"
      color="#FFFFFF">
    </a-text>


    <!-- النص السفلي -->

    <a-text
      value="AR EXPERIENCE"
      position="-0.38 -0.55 0.1"
      scale="0.25 0.25 0.25"
      color="#FFFFFF">
    </a-text>


  </a-entity>

</a-scene>

</body>
</html>
