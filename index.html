<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Spine AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- FBX Loader -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="status">
  Loading spine...
</div>

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- Camera -->

  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>


  <!-- Lighting -->

  <a-light
    type="ambient"
    color="#FFFFFF"
    intensity="2">
  </a-light>

  <a-light
    type="directional"
    color="#FFFFFF"
    intensity="3"
    position="1 2 3">
  </a-light>


  <!-- Image Target -->

  <a-entity

    id="target"

    mindar-image-target="targetIndex: 0">


    <!-- SPINE -->

    <a-entity

      id="spineModel"

      fbx-model="src: url(./spine.FBX)"

      position="0 0 0.25"

      rotation="0 0 0"

      scale="1 1 1">

    </a-entity>



    <!-- CERVICAL -->

    <a-text

      value="CERVICAL"

      position="0.20 0.43 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF"

      align="left">

    </a-text>


    <a-box

      position="0.10 0.43 0.10"

      width="0.18"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>



    <!-- THORACIC -->

    <a-text

      value="THORACIC"

      position="-0.55 0.05 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF"

      align="left">

    </a-text>


    <a-box

      position="-0.13 0.05 0.10"

      width="0.25"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>



    <!-- LUMBAR -->

    <a-text

      value="LUMBAR"

      position="0.20 -0.37 0.12"

      scale="0.22 0.22 0.22"

      color="#FFFFFF"

      align="left">

    </a-text>


    <a-box

      position="0.10 -0.37 0.10"

      width="0.18"

      height="0.004"

      depth="0.004"

      color="#FFFFFF">

    </a-box>


  </a-entity>

</a-scene>



<script>

  const spine = document.querySelector("#spineModel");
  const status = document.querySelector("#status");
  const target = document.querySelector("#target");


  spine.addEventListener("model-loaded", function () {

    status.innerHTML = "Spine loaded ✓";

    setTimeout(function () {
      status.style.display = "none";
    }, 2000);

    console.log("SPINE FBX LOADED");

  });


  spine.addEventListener("model-error", function (event) {

    status.innerHTML = "ERROR loading spine.FBX";

    console.error(
      "FBX ERROR:",
      event.detail
    );

  });


  target.addEventListener("targetFound", function () {

    console.log("TARGET FOUND");

  });


  target.addEventListener("targetLost", function () {

    console.log("TARGET LOST");

  });

</script>


</body>
</html>
